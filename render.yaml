services:
  # ==============================================================================
  # FestiveAI Unified Full-Stack Service (FastAPI + React Vite in Single Container)
  # ==============================================================================
  - type: web
    name: festiveai
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: "/health"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "gAAAAABmFz-mockEncryptionKeyFestiveAI32BytesNeededForFernet="
      - key: DATABASE_URL
        value: "sqlite:///./festiveai.db"
      - key: DEFAULT_AI_PROVIDER
        value: "mock"
      - key: MEDIA_ROOT
        value: "./media"
      - key: STATIC_UPLOADS
        value: "./media/uploads"
      - key: GENERATED_ASSETS
        value: "./media/generated"
      - key: AUTONOMOUS_WORKER_INTERVAL_SECONDS
        value: "300"
