services:
  # ==============================================================================
  # FestiveAI Unified Full-Stack Service (FastAPI Backend + React Frontend)
  # ==============================================================================
  - type: web
    name: festiveai-app
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "gAAAAABmFz-mockEncryptionKeyFestiveAI32BytesNeededForFernet="
      - key: DATABASE_URL
        value: "sqlite:///./festiveai.db"
      - key: DEFAULT_AI_PROVIDER
        value: "mock"
      - key: MEDIA_ROOT
        value: "./media"
      - key: STATIC_UPLOADS
        value: "./media/uploads"
      - key: GENERATED_ASSETS
        value: "./media/generated"
      - key: AUTONOMOUS_WORKER_INTERVAL_SECONDS
        value: "300"
